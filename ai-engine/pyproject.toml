[project]
name = "promptflow-ai-engine"
version = "0.1.0"
description = "Python AI flow execution service for Promptflow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.1.0",
  "openai>=1.10.0",
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
